[project]
name = "mangai-workers"
version = "0.1.0"
description = "MangAI worker service"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mangai-workers = "mangai_workers.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
