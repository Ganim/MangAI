[project]
name = "mangai-api"
version = "0.1.0"
description = "MangAI API service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.34,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.8,<3.0",
    "python-multipart>=0.0.20,<1.0",
]

[project.scripts]
mangai-api = "mangai_api.main:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
